<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">RepNix repository health audit</title>
  <desc id="desc">A dark terminal window showing RepNix detecting a TypeScript React repository, its existing guardrails, and recommendations for missing dead-code, duplication, and security checks.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="24" fill="#e8eef7"/>
  <rect x="42" y="34" width="1116" height="552" rx="18" fill="url(#background)" filter="url(#shadow)"/>
  <rect x="42" y="34" width="1116" height="58" rx="18" fill="#1f2937"/>
  <path d="M42 74h1116v18H42z" fill="#1f2937"/>
  <circle cx="76" cy="63" r="8" fill="#fb7185"/>
  <circle cx="104" cy="63" r="8" fill="#fbbf24"/>
  <circle cx="132" cy="63" r="8" fill="#34d399"/>
  <text x="600" y="69" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" text-anchor="middle">repnix audit</text>

  <g font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="19">
    <text x="78" y="132" fill="#e2e8f0"><tspan fill="#34d399">$</tspan><tspan dx="12">npx repnix audit</tspan></text>

    <text x="78" y="180" fill="#f8fafc" font-weight="700">Repository</text>
    <text x="78" y="212" fill="#94a3b8">typescript</text>
    <text x="248" y="212" fill="#94a3b8">react</text>
    <text x="350" y="212" fill="#94a3b8">pnpm (lockfile)</text>
    <text x="600" y="212" fill="#94a3b8">GitHub Actions</text>

    <text x="78" y="260" fill="#f8fafc" font-weight="700">Repository Guardrails</text>
    <path d="M78 275h1028" stroke="#334155"/>

    <text x="78" y="311" fill="#cbd5e1">Type safety</text>
    <text x="360" y="311" fill="#34d399">✓</text>
    <text x="398" y="311" fill="#94a3b8">TypeScript</text>

    <text x="78" y="345" fill="#cbd5e1">Linting</text>
    <text x="360" y="345" fill="#34d399">✓</text>
    <text x="398" y="345" fill="#94a3b8">ESLint</text>

    <text x="78" y="379" fill="#cbd5e1">Formatting</text>
    <text x="360" y="379" fill="#34d399">✓</text>
    <text x="398" y="379" fill="#94a3b8">Prettier</text>

    <text x="78" y="413" fill="#cbd5e1">Tests</text>
    <text x="360" y="413" fill="#34d399">✓</text>
    <text x="398" y="413" fill="#94a3b8">Vitest</text>

    <text x="78" y="447" fill="#cbd5e1">Dead code</text>
    <text x="360" y="447" fill="#fb7185">✗</text>
    <text x="398" y="447" fill="#94a3b8">Missing</text>

    <text x="78" y="481" fill="#cbd5e1">Duplication</text>
    <text x="360" y="481" fill="#fb7185">✗</text>
    <text x="398" y="481" fill="#94a3b8">Missing</text>

    <text x="78" y="515" fill="#cbd5e1">Dependency security</text>
    <text x="360" y="515" fill="#fb7185">✗</text>
    <text x="398" y="515" fill="#94a3b8">Missing</text>

    <text x="690" y="260" fill="#f8fafc" font-weight="700">Recommended baseline</text>
    <path d="M690 275h416" stroke="#334155"/>

    <text x="690" y="316" fill="#fbbf24">+</text>
    <text x="720" y="316" fill="#f8fafc" font-weight="700">Knip</text>
    <text x="720" y="348" fill="#94a3b8" font-size="16">Unused files, exports, and</text>
    <text x="720" y="374" fill="#94a3b8" font-size="16">dependencies are not covered.</text>

    <text x="690" y="428" fill="#fbbf24">+</text>
    <text x="720" y="428" fill="#f8fafc" font-weight="700">jscpd</text>
    <text x="720" y="460" fill="#94a3b8" font-size="16">No duplication provider</text>
    <text x="720" y="486" fill="#94a3b8" font-size="16">is active.</text>

    <text x="690" y="544" fill="#64748b" font-size="16">Run setup to preview the changes.</text>
  </g>
</svg>

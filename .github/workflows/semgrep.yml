name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  code:
    name: Semgrep Code
    # GitHub does not pass repository secrets to forks. Do not use pull_request_target
    # for security scanning because it would execute untrusted pull-request code.
    if: vars.SEMGREP_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
  secrets:
    name: Semgrep Secrets
    if: vars.SEMGREP_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: semgrep ci --secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
  supply-chain:
    name: Semgrep Supply Chain
    if: vars.SEMGREP_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: semgrep ci --supply-chain
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

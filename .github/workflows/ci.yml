name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare Changesets base branch
        run: |
          git fetch origin main:refs/remotes/origin/main
          if [ "$(git branch --show-current)" != "main" ]; then
            git branch --force main refs/remotes/origin/main
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Install standalone health tools
        if: matrix.node == 22 && !startsWith(github.head_ref || github.ref_name, 'changeset-release/')
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.0.2
          go install github.com/zricethezav/gitleaks/v8@v8.24.2
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Prepare OSV-Scanner database
        if: matrix.node == 22 && !startsWith(github.head_ref || github.ref_name, 'changeset-release/')
        continue-on-error: true
        run: osv-scanner scan source --offline-vulnerabilities --download-offline-databases --format=json --recursive .
      - run: pnpm health
        if: matrix.node == 22 && !startsWith(github.head_ref || github.ref_name, 'changeset-release/')
      - name: Generate RepNix SARIF report
        if: matrix.node == 22 && !startsWith(github.head_ref || github.ref_name, 'changeset-release/')
        continue-on-error: true
        run: node dist/cli.js check --format sarif > repnix-health.sarif
      - name: Upload SARIF to GitHub Security
        if: matrix.node == 22 && !startsWith(github.head_ref || github.ref_name, 'changeset-release/') && github.repository == 'zakaihamilton/repnix'
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: repnix-health.sarif
          category: repnix-health

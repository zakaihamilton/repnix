name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Read package metadata
        id: package
        run: |
          package_name="$(node --input-type=module -e 'import fs from "node:fs"; process.stdout.write(JSON.parse(fs.readFileSync("package.json", "utf8")).name)')"
          package_version="$(node --input-type=module -e 'import fs from "node:fs"; process.stdout.write(JSON.parse(fs.readFileSync("package.json", "utf8")).version)')"
          {
            echo "name=$package_name"
            echo "version=$package_version"
          } >> "$GITHUB_OUTPUT"
      - name: Check whether the version is already published
        id: published
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set +e
          output=$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping."
          elif printf '%s' "$output" | grep -qE 'E404|404 Not Found|is not in this registry'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not published yet."
          else
            printf '%s\n' "$output"
            echo "Unable to determine whether ${PACKAGE_NAME}@${PACKAGE_VERSION} is published." >&2
            exit "$status"
          fi
      - name: Publish package
        if: steps.published.outputs.exists != 'true'
        run: npm publish

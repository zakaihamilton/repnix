name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Install standalone health tools
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.0.2
          go install github.com/zricethezav/gitleaks/v8@v8.24.2
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Prepare OSV-Scanner database
        continue-on-error: true
        run: osv-scanner scan source --offline-vulnerabilities --download-offline-databases --format=json --recursive .
      - run: pnpm health
      - name: Validate release metadata
        run: pnpm health:release
      - name: Version packages or publish the release
        id: release
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm release:version
          publish-script: node .github/release-publish.mjs
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          create-github-releases: false
          push-git-tags: true
      - name: Ensure release tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "v${version} already exists."
            exit 0
          fi
          git tag "v${version}"
          git push origin "v${version}"
